<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dockerfile Workshop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0c2038;
  --navy-deep:#081726;
  --panel:#102b46;
  --panel-alt:#0d253d;
  --grid-line:rgba(148,197,255,0.05);
  --border:#264a6e;
  --border-soft:rgba(96,146,196,0.28);
  --ink:#eef4fb;
  --ink-dim:#9db6d1;
  --ink-faint:#5f7fa0;
  --amber:#e5883c;
  --amber-dim:rgba(229,136,60,0.14);
  --beginner:#4fbf96;
  --intermediate:#e0b23c;
  --advanced:#e2646f;
  --radius:5px;
  --sans: 'IBM Plex Sans', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', 'SFMono-Regular', Menlo, monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans);
  background:
    linear-gradient(var(--grid-line) 1px, transparent 1px) 0 0/32px 32px,
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px) 0 0/32px 32px,
    var(--navy);
  color:var(--ink);
  min-height:100vh;
  padding:28px 20px 60px;
}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

.app{max-width:1040px;margin:0 auto}

/* header */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.mark{display:flex;align-items:center;gap:10px}
.mark svg{flex-shrink:0}
.mark h1{font-size:20px;font-weight:600;letter-spacing:0.01em}
.mark p{font-size:12.5px;color:var(--ink-faint);font-family:var(--mono);margin-top:2px}
.progress-wrap{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12px;color:var(--ink-dim)}
.progress-track{width:110px;height:5px;background:var(--panel-alt);border:1px solid var(--border);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:var(--amber);transition:width .35s ease}
.reset-btn{background:none;border:none;color:var(--ink-faint);font-family:var(--mono);font-size:11.5px;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.reset-btn:hover{color:var(--ink-dim)}

/* tabs */
.tabs{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;padding-bottom:2px}
.tab{
  padding:8px 16px;border:1px solid var(--border-soft);border-radius:var(--radius) var(--radius) 0 0;
  background:var(--panel-alt);cursor:pointer;font-size:13.5px;color:var(--ink-dim);
  white-space:nowrap;position:relative;top:1px;border-bottom-color:var(--border-soft);
}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px}
.tab.on{background:var(--panel);color:var(--ink);border-color:var(--border);border-bottom-color:var(--panel);font-weight:500}
.tab:hover:not(.on){color:var(--ink)}

.layout{display:grid;grid-template-columns:230px 1fr;gap:16px;align-items:start;border-top:1px solid var(--border);padding-top:16px}

/* sidebar */
.exlist{display:flex;flex-direction:column;gap:6px;max-height:640px;overflow-y:auto;padding-right:2px}
.exitem{
  display:flex;align-items:flex-start;gap:9px;text-align:left;
  padding:10px 11px;border:1px solid var(--border-soft);border-radius:var(--radius);
  cursor:pointer;background:var(--panel-alt);width:100%;
}
.exitem:hover{border-color:var(--border)}
.exitem.sel{background:var(--panel);border-color:var(--amber)}
.exitem .num{font-family:var(--mono);font-size:11px;color:var(--ink-faint);flex-shrink:0;padding-top:1px;min-width:20px}
.exitem.sel .num{color:var(--amber)}
.exitem .ti{font-size:13.5px;line-height:1.4;color:var(--ink)}
.exitem .check{margin-left:auto;flex-shrink:0;color:var(--beginner);opacity:0;padding-top:2px}
.exitem .check.on{opacity:1}

/* panel */
.panel{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  padding:26px 26px 0;position:relative;min-height:640px;display:flex;flex-direction:column;
}
.panel::before{
  content:"";position:absolute;top:10px;left:10px;right:10px;bottom:10px;
  border:1px solid var(--border-soft);border-radius:3px;pointer-events:none;
}
.panel-body{flex:1}
.plevel{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12px;color:var(--ink-faint);margin-bottom:10px}
.lvl-tag{font-family:var(--mono);font-size:11.5px;padding:2px 7px;border:1px solid currentColor;border-radius:3px}
.lvl-tag.beginner{color:var(--beginner)}
.lvl-tag.intermediate{color:var(--intermediate)}
.lvl-tag.advanced{color:var(--advanced)}
.ptitle{font-size:22px;font-weight:600;margin-bottom:10px;line-height:1.3}
.pdesc{font-size:14px;color:var(--ink-dim);line-height:1.65;margin-bottom:14px;max-width:62ch}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.tag{font-size:11.5px;padding:3px 8px;border-radius:3px;background:var(--panel-alt);color:var(--ink-dim);font-family:var(--mono);border:1px solid var(--border)}
.slabel{font-size:12px;font-weight:500;color:var(--ink-faint);margin:16px 0 7px;font-family:var(--mono)}
.goal{
  padding:12px 14px;background:var(--amber-dim);border:1px dashed var(--amber);
  border-radius:var(--radius);font-size:13.5px;color:var(--ink);line-height:1.6;margin-bottom:4px;
}
.goal b{color:var(--amber);font-weight:600}
pre{
  background:var(--panel-alt);border:1px solid var(--border);border-radius:var(--radius);
  padding:13px 15px;font-family:var(--mono);font-size:12.5px;overflow-x:auto;
  line-height:1.7;color:var(--ink);white-space:pre;
}
.codewrap{position:relative}
.copybtn{
  position:absolute;top:8px;right:8px;display:flex;align-items:center;gap:5px;
  background:var(--panel);border:1px solid var(--border);border-radius:4px;
  padding:4px 8px;font-size:11px;color:var(--ink-faint);cursor:pointer;font-family:var(--mono);
}
.copybtn:hover{color:var(--ink);border-color:var(--border-soft)}

.tbtn{
  display:flex;align-items:center;gap:8px;padding:9px 14px;border:1px solid var(--border-soft);
  border-radius:var(--radius);background:transparent;cursor:pointer;font-size:13.5px;
  color:var(--ink-dim);margin-top:10px;width:100%;text-align:left;
}
.tbtn:hover{background:var(--panel-alt);color:var(--ink)}
.hbox{margin-top:8px;padding:12px 14px;background:var(--panel-alt);border:1px solid var(--border);border-left:2px solid var(--intermediate);border-radius:0 var(--radius) var(--radius) 0;font-size:13.5px;color:var(--ink-dim);line-height:1.65}
.hbox code{font-family:var(--mono);background:rgba(148,197,255,0.08);padding:1px 5px;border-radius:3px;color:var(--ink)}
.hbox em{color:var(--ink);font-style:normal;border-bottom:1px dotted var(--ink-faint)}
.sbox{margin-top:8px}
.cmds{font-family:var(--mono);font-size:12px;padding:11px 14px;background:var(--panel-alt);border:1px solid var(--border);border-radius:var(--radius);color:var(--ink-dim);margin-top:8px;line-height:1.75}
.hidden{display:none}

.titleblock{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  border-top:1px solid var(--border);margin-top:22px;padding:12px 0;
  font-family:var(--mono);font-size:12px;color:var(--ink-faint);
}
.navbtn{display:flex;align-items:center;gap:6px;background:none;border:1px solid var(--border-soft);border-radius:var(--radius);padding:7px 12px;cursor:pointer;color:var(--ink-dim);font-size:12.5px;font-family:var(--sans)}
.navbtn:hover:not(:disabled){color:var(--ink);border-color:var(--border)}
.navbtn:disabled{opacity:0.3;cursor:not-allowed}
.sheet{white-space:nowrap}

@media (max-width:760px){
  .layout{grid-template-columns:1fr}
  .exlist{max-height:220px;flex-direction:row;overflow-x:auto;overflow-y:hidden}
  .exitem{min-width:190px}
  .panel{padding:20px 18px 0}
  .ptitle{font-size:19px}
}
@media (prefers-reduced-motion: reduce){
  .progress-fill{transition:none}
}
</style>
</head>
<body>
<h2 class="sr-only">Dockerfile exercises from beginner to advanced, with hints and solutions</h2>

<div class="app">
  <div class="head">
    <div class="mark">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#e5883c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="9" width="6" height="6"></rect><rect x="9.5" y="9" width="6" height="6"></rect><rect x="9.5" y="2.5" width="6" height="6"></rect><rect x="16" y="9" width="6" height="6"></rect><path d="M2 15.5c0 3 3 5.5 10 5.5s10-2.5 10-5.5"></path></svg>
      <div>
        <h1>Dockerfile Workshop</h1>
        <p>fill the blanks &middot; check your work</p>
      </div>
    </div>
    <div class="progress-wrap">
      <span id="progtext">0 / 16 solved</span>
      <div class="progress-track"><div class="progress-fill" id="progfill" style="width:0%"></div></div>
      <button class="reset-btn" id="resetbtn" onclick="resetProgress()">reset</button>
    </div>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab on" onclick="switchLevel(0)"><span class="dot" style="background:#4fbf96"></span>Beginner</button>
    <button class="tab" onclick="switchLevel(1)"><span class="dot" style="background:#e0b23c"></span>Intermediate</button>
    <button class="tab" onclick="switchLevel(2)"><span class="dot" style="background:#e2646f"></span>Advanced</button>
  </div>

  <div class="layout">
    <div class="exlist" id="exlist"></div>
    <div class="panel" id="panel"></div>
  </div>
</div>

<script>
const ICON = {
  lightbulb:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"></path><path d="M10 22h4"></path><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.2 1 2.05V17h6v-.25c0-.85.4-1.55 1-2.05A7 7 0 0 0 12 2Z"></path></svg>',
  code:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>',
  chevronUp:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>',
  copy:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>',
  check:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>',
  arrowLeft:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>',
  arrowRight:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>',
  check2:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>'
};

const exercises = [
  // BEGINNER
  [
    {
      title:"Hello Alpine",
      desc:"Write your very first Dockerfile. It should be based on Alpine Linux and print a greeting when run.",
      tags:["FROM","CMD"],
      goal:"Build an image that prints \"Hello from Docker!\" using the exec form of CMD.",
      template:`FROM ___
CMD ["echo", "Hello from Docker!"]`,
      hint:"Use <code>alpine:3.19</code> as your base image. The exec form of CMD uses JSON array syntax — it doesn't invoke a shell, so it's the preferred form.",
      solution:`FROM alpine:3.19
CMD ["echo", "Hello from Docker!"]`,
      cmds:`docker build -t hello-docker .
docker run hello-docker`
    },
    {
      title:"Install a Package",
      desc:"Extend an Alpine image by installing a package and verifying it works.",
      tags:["RUN","apk add","layer"],
      goal:"Install curl and set CMD to run curl --version.",
      template:`FROM alpine:3.19
RUN ___
CMD ["curl", "--version"]`,
      hint:"Alpine uses <code>apk add --no-cache &lt;package&gt;</code>. The <code>--no-cache</code> flag avoids storing the index locally, keeping the image smaller.",
      solution:`FROM alpine:3.19
RUN apk add --no-cache curl
CMD ["curl", "--version"]`,
      cmds:`docker build -t curl-alpine .
docker run curl-alpine`
    },
    {
      title:"Copy Files",
      desc:"Copy a local file into the image and set a working directory for your app.",
      tags:["COPY","WORKDIR"],
      goal:"Create an index.html on your host, copy it into /app inside the image, and print it.",
      template:`FROM alpine:3.19
WORKDIR ___
COPY ___ ___
CMD ["cat", "index.html"]`,
      hint:"<code>WORKDIR /app</code> creates the directory and sets it as the current path. <code>COPY src dest</code> — using <code>.</code> as dest copies into WORKDIR.",
      solution:`FROM alpine:3.19
WORKDIR /app
COPY index.html .
CMD ["cat", "index.html"]`,
      cmds:`echo "<h1>Hello Docker</h1>" > index.html
docker build -t copy-demo .
docker run copy-demo`
    },
    {
      title:"Environment Variables",
      desc:"Use ENV to bake a variable into the image that is accessible at runtime.",
      tags:["ENV"],
      goal:"Set an env variable NAME=Docker and have CMD print \"Hello, Docker!\" using it.",
      template:`FROM alpine:3.19
ENV ___=___
CMD ["sh", "-c", "echo Hello, $NAME!"]`,
      hint:"<code>ENV KEY=VALUE</code> sets an environment variable that persists in all subsequent layers and at runtime. You can override it at run time with <code>-e NAME=other</code>.",
      solution:`FROM alpine:3.19
ENV NAME=Docker
CMD ["sh", "-c", "echo Hello, $NAME!"]`,
      cmds:`docker build -t env-demo .
docker run env-demo
docker run -e NAME=42 env-demo`
    },
    {
      title:"Expose a Port",
      desc:"Document which port your service listens on using EXPOSE.",
      tags:["EXPOSE"],
      goal:"Create an nginx image that EXPOSEs port 80, then run it and map it to port 8080 on your host.",
      template:`FROM nginx:1.25-alpine
EXPOSE ___
CMD ["nginx", "-g", "daemon off;"]`,
      hint:"<code>EXPOSE</code> is documentation — it does NOT publish the port. You publish with <code>-p host:container</code> at run time. nginx listens on 80 by default.",
      solution:`FROM nginx:1.25-alpine
EXPOSE 80
CMD ["nginx", "-g", "daemon off;"]`,
      cmds:`docker build -t my-nginx .
docker run -p 8080:80 my-nginx
# Visit http://localhost:8080`
    },
    {
      title:"Non-Root User",
      desc:"Running as root inside a container is a security risk. Create and switch to a dedicated user.",
      tags:["USER","RUN adduser"],
      goal:"Create a user called appuser and run CMD as that user. Verify with whoami.",
      template:`FROM alpine:3.19
RUN adduser -D ___
USER ___
CMD ["whoami"]`,
      hint:"<code>adduser -D username</code> creates a user without a password. The <code>USER</code> instruction applies to all subsequent <code>RUN</code>, <code>CMD</code>, and <code>ENTRYPOINT</code> instructions.",
      solution:`FROM alpine:3.19
RUN adduser -D appuser
USER appuser
CMD ["whoami"]`,
      cmds:`docker build -t user-demo .
docker run user-demo
# Should print: appuser`
    }
  ],
  // INTERMEDIATE
  [
    {
      title:"ENTRYPOINT vs CMD",
      desc:"Understand how ENTRYPOINT and CMD work together — and why the distinction matters for flexible images.",
      tags:["ENTRYPOINT","CMD","exec form"],
      goal:"Set ENTRYPOINT to echo and CMD to a default message. Then run the container with a custom message to override CMD only.",
      template:`FROM alpine:3.19
ENTRYPOINT ["echo"]
CMD ["___"]`,
      hint:"When ENTRYPOINT is set, CMD provides <em>default arguments</em> to it. Running <code>docker run img custom msg</code> replaces CMD with <code>custom msg</code> but keeps ENTRYPOINT. To fully replace ENTRYPOINT: use <code>--entrypoint</code>.",
      solution:`FROM alpine:3.19
ENTRYPOINT ["echo"]
CMD ["Hello — this is the default message"]`,
      cmds:`docker build -t ep-demo .
docker run ep-demo
# → Hello — this is the default message
docker run ep-demo "Custom override"
# → Custom override`
    },
    {
      title:"Build Arguments (ARG)",
      desc:"ARG lets you pass variables at build time — they are NOT available at runtime. Useful for versioning and configuration during the build.",
      tags:["ARG","build-time","--build-arg"],
      goal:"Define an ARG for Alpine version (default 3.19) and use it in FROM. Build the same Dockerfile for two different versions.",
      template:`ARG ___=3.19
FROM alpine:${"\${"}___}
CMD ["cat", "/etc/alpine-release"]`,
      hint:"<code>ARG</code> must be declared <em>before</em> <code>FROM</code> to use it in the FROM line. After FROM, re-declare it (<code>ARG ALPINE_VERSION</code> with no default) if you need it again in RUN steps.",
      solution:`ARG ALPINE_VERSION=3.19
FROM alpine:\${ALPINE_VERSION}
CMD ["cat", "/etc/alpine-release"]`,
      cmds:`docker build -t alpine-default .
docker run alpine-default
# → 3.19.x

docker build --build-arg ALPINE_VERSION=3.18 -t alpine-old .
docker run alpine-old
# → 3.18.x`
    },
    {
      title:"Multi-Stage Build",
      desc:"Multi-stage builds let you compile code in one image and copy only the result into a minimal final image — keeping your production image lean.",
      tags:["multi-stage","AS","COPY --from"],
      goal:"Compile a small C program in a builder stage and copy only the binary into a clean Alpine image.",
      template:`FROM alpine:3.19 AS ___
RUN apk add --no-cache gcc musl-dev
WORKDIR /build
COPY hello.c .
RUN gcc -o hello hello.c

FROM alpine:3.19
COPY --from=___ /build/hello /usr/local/bin/
CMD ["hello"]`,
      hint:"Name your first stage with <code>AS builder</code>. <code>COPY --from=builder</code> pulls files from that stage. The final image contains only what you explicitly copy — no compiler, no source.",
      solution:`FROM alpine:3.19 AS builder
RUN apk add --no-cache gcc musl-dev
WORKDIR /build
COPY hello.c .
RUN gcc -o hello hello.c

FROM alpine:3.19
COPY --from=builder /build/hello /usr/local/bin/
CMD ["hello"]`,
      cmds:`# hello.c: #include<stdio.h>
int main(){printf("Hello!\\n");}
docker build -t multi-stage .
docker run multi-stage
docker images multi-stage   # Much smaller than builder!`
    },
    {
      title:"Entrypoint Script",
      desc:"Real services need initialization before starting. An entrypoint script handles setup and then hands off to the main process correctly.",
      tags:["entrypoint.sh","exec","PID 1","signals"],
      goal:"Write a shell entrypoint script that prints an env variable then runs CMD using exec. Understand why exec is critical.",
      template:`FROM alpine:3.19
ENV GREETING="Hello"
COPY entrypoint.sh /entrypoint.sh
RUN chmod +x /entrypoint.sh
ENTRYPOINT ["/entrypoint.sh"]
CMD ["echo", "done"]`,
      hint:"<code>exec \"$@\"</code> is essential — it <em>replaces</em> the shell process with your CMD, making CMD become PID 1. Without exec, the shell stays as PID 1 and won't forward signals to your app. Always use exec at the end of entrypoint scripts.",
      solution:`# entrypoint.sh:
#!/bin/sh
echo "Greeting: $GREETING"
exec "$@"

# Dockerfile:
FROM alpine:3.19
ENV GREETING="Hello from Docker"
COPY entrypoint.sh /entrypoint.sh
RUN chmod +x /entrypoint.sh
ENTRYPOINT ["/entrypoint.sh"]
CMD ["echo", "CMD ran correctly"]`,
      cmds:`docker build -t ep-script .
docker run ep-script
# → Greeting: Hello from Docker
# → CMD ran correctly`
    },
    {
      title:"Layer Caching Optimization",
      desc:"Docker caches each layer. If a layer changes, all layers after it are rebuilt. Ordering your instructions correctly dramatically speeds up builds.",
      tags:["layer cache","ordering","RUN"],
      goal:"Fix the Dockerfile below so that dependency installation is cached independently from source code changes.",
      template:`# BAD — every code change reinstalls all deps:
FROM python:3.11-alpine
COPY . /app
WORKDIR /app
RUN pip install -r requirements.txt
CMD ["python", "app.py"]

# FIX IT:`,
      hint:"Copy only the dependency manifest first (<code>requirements.txt</code>), run the install, <em>then</em> copy the rest of the source. When you change app.py, Docker reuses the cached pip install layer.",
      solution:`# GOOD — pip install layer is cached:
FROM python:3.11-alpine
WORKDIR /app
COPY requirements.txt .
RUN pip install --no-cache-dir -r requirements.txt
COPY . .
CMD ["python", "app.py"]`,
      cmds:`# Also create a .dockerignore:
# __pycache__/
# *.pyc
# .env
# .git`
    }
  ],
  // ADVANCED
  [
    {
      title:"The PID 1 Problem",
      desc:"PID 1 is special in Linux — it receives signals that other processes don't. Running your app incorrectly means SIGTERM is never received and containers won't stop cleanly.",
      tags:["PID 1","SIGTERM","exec form","tini"],
      goal:"Understand the difference between shell form and exec form, and why using a shell wrapper without exec breaks signal handling.",
      template:`# Shell form — WRONG for PID 1:
CMD nginx -g "daemon off;"
# Shell is PID 1, nginx is PID 2. SIGTERM hits the
# shell, which does NOT forward it to nginx by default.

# Exec form — CORRECT:
CMD ___

# Or with a wrapper script — only correct if:
ENTRYPOINT ["/entrypoint.sh"]
# entrypoint.sh must end with: exec "$@"`,
      hint:"The exec form (<code>[\"cmd\", \"arg\"]</code>) makes your process PID 1 directly. In entrypoint scripts, <code>exec \"$@\"</code> replaces the shell with CMD. For complex apps, consider <code>tini</code> as a minimal init: <code>RUN apk add tini</code> + <code>ENTRYPOINT [\"/sbin/tini\", \"--\"]</code>.",
      solution:`# Correct exec form:
FROM nginx:1.25-alpine
CMD ["nginx", "-g", "daemon off;"]

# With tini for robust signal handling:
FROM alpine:3.19
RUN apk add --no-cache nginx tini
ENTRYPOINT ["/sbin/tini", "--"]
CMD ["nginx", "-g", "daemon off;"]`,
      cmds:`# Test: does SIGTERM stop it cleanly?

const LEVEL_LABELS = ['Beginner','Intermediate','Advanced'];
const LEVEL_CLASS = ['beginner','intermediate','advanced'];
const OFFSET = [0,6,11];
const TOTAL = exercises.reduce((n,arr)=>n+arr.length,0);

let currentLevel = 0;
let currentEx = 0;
let hintOpen = false;
let solOpen = false;
const completed = new Set(); // keys like "0-2"

function key(lvl,i){ return lvl+'-'+i; }

function switchLevel(lvl) {
  currentLevel = lvl;
  currentEx = 0;
  hintOpen = false;
  solOpen = false;
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('on', i===lvl));
  renderList();
  renderPanel();
}

function selectEx(i) {
  currentEx = i;
  hintOpen = false;
  solOpen = false;
  renderList();
  renderPanel();
}

function goStep(delta){
  const list = exercises[currentLevel];
  const next = currentEx + delta;
  if (next >= 0 && next < list.length){
    selectEx(next);
  }
}

function toggleHint() {
  hintOpen = !hintOpen;
  document.getElementById('hcontent').classList.toggle('hidden', !hintOpen);
  document.getElementById('hbtn').innerHTML = (hintOpen?ICON.chevronUp:ICON.lightbulb) + (hintOpen?' Hide hint':' Show hint');
  document.getElementById('hbtn').setAttribute('aria-expanded', hintOpen);
}

function toggleSol() {
  solOpen = !solOpen;
  document.getElementById('scontent').classList.toggle('hidden', !solOpen);
  document.getElementById('sbtn').innerHTML = (solOpen?ICON.chevronUp:ICON.code) + (solOpen?' Hide solution':' Reveal solution');
  document.getElementById('sbtn').setAttribute('aria-expanded', solOpen);
  if (solOpen){
    completed.add(key(currentLevel,currentEx));
    renderList();
    updateProgress();
  }
}

function updateProgress(){
  const n = completed.size;
  document.getElementById('progtext').textContent = n + ' / ' + TOTAL + ' solved';
  document.getElementById('progfill').style.width = Math.round((n/TOTAL)*100) + '%';
}

function resetProgress(){
  completed.clear();
  renderList();
  updateProgress();
}

function copyText(btnId, text){
  navigator.clipboard.writeText(text).then(()=>{
    const btn = document.getElementById(btnId);
    if(!btn) return;
    const original = btn.innerHTML;
    btn.innerHTML = ICON.check2 + ' Copied';
    setTimeout(()=>{ btn.innerHTML = original; }, 1400);
  });
}

function esc(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderList() {
  const list = document.getElementById('exlist');
  const exs = exercises[currentLevel];
  const offset = OFFSET[currentLevel];
  list.innerHTML = exs.map((e,i) => `
    <button class="exitem ${i===currentEx?'sel':''}" onclick="selectEx(${i})">
      <span class="num">${String(offset+i+1).padStart(2,'0')}</span>
      <span class="ti">${e.title}</span>
      <span class="check ${completed.has(key(currentLevel,i))?'on':''}">${ICON.check}</span>
    </button>
  `).join('');
}

function renderPanel() {
  const e = exercises[currentLevel][currentEx];
  const offset = OFFSET[currentLevel];
  const num = offset+currentEx+1;
  const list = exercises[currentLevel];
  document.getElementById('panel').innerHTML = `
    <div class="panel-body">
      <div class="plevel">
        <span class="lvl-tag ${LEVEL_CLASS[currentLevel]}">${LEVEL_LABELS[currentLevel]}</span>
        <span>Exercise ${String(num).padStart(2,'0')} of ${TOTAL}</span>
      </div>
      <div class="ptitle">${e.title}</div>
      <div class="pdesc">${e.desc}</div>
      <div class="tags">${e.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
      <div class="goal"><b>Goal —</b> ${e.goal}</div>

      <div class="slabel">Template</div>
      <div class="codewrap">
        <pre>${esc(e.template)}</pre>
        <button class="copybtn" id="copytpl">${ICON.copy} Copy</button>
      </div>

      <button class="tbtn" id="hbtn" onclick="toggleHint()" aria-expanded="false">
        ${ICON.lightbulb} Show hint
      </button>
      <div id="hcontent" class="hidden">
        <div class="hbox">${e.hint}</div>
      </div>

      <button class="tbtn" id="sbtn" onclick="toggleSol()" aria-expanded="false">
        ${ICON.code} Reveal solution
      </button>
      <div id="scontent" class="hidden">
        <div class="sbox">
          <div class="codewrap">
            <pre>${esc(e.solution)}</pre>
            <button class="copybtn" id="copysol">${ICON.copy} Copy</button>
          </div>
          ${e.cmds ? `<div class="slabel">Commands to test</div><pre class="cmds">${esc(e.cmds)}</pre>` : ''}
        </div>
      </div>
    </div>

    <div class="titleblock">
      <button class="navbtn" ${currentEx===0?'disabled':''} onclick="goStep(-1)">${ICON.arrowLeft} Previous</button>
      <span class="sheet">sheet ${String(currentEx+1).padStart(2,'0')} / ${String(list.length).padStart(2,'0')} &middot; ${LEVEL_LABELS[currentLevel].toLowerCase()}</span>
      <button class="navbtn" ${currentEx===list.length-1?'disabled':''} onclick="goStep(1)">Next ${ICON.arrowRight}</button>
    </div>
  `;
  document.getElementById('copytpl').addEventListener('click', ()=>copyText('copytpl', e.template));
  document.getElementById('copysol').addEventListener('click', ()=>copyText('copysol', e.solution));
}

renderList();
renderPanel();
updateProgress();
</script>
</body>
</html>
